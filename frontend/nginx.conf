server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: ${VITE_BASE_PATH}/* → ${VITE_BASE_PATH}/index.html
    location ${VITE_BASE_PATH}/ {
        try_files $uri $uri/ ${VITE_BASE_PATH}/index.html;
    }

    # Root redirect to ${VITE_BASE_PATH}/
    location = / {
        return 302 ${VITE_BASE_PATH}/;
    }

    # Proxy API to backend (keep base path prefix — backend uses root_path)
    location ${VITE_BASE_PATH}/api/ {
        proxy_pass http://parser3-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Health/docs passthrough
    location ${VITE_BASE_PATH}/health {
        proxy_pass http://parser3-backend:8000/health;
        proxy_set_header Host $host;
    }
    location ${VITE_BASE_PATH}/docs {
        proxy_pass http://parser3-backend:8000/docs;
        proxy_set_header Host $host;
    }
    location ${VITE_BASE_PATH}/openapi.json {
        proxy_pass http://parser3-backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # WebSocket
    location ${VITE_BASE_PATH}/ws/ {
        proxy_pass http://parser3-backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Cache static
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
