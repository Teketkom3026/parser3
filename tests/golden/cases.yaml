# Golden-кейсы для парсера контактов.
# Каждый кейс = замороженная HTML-фикстура (tests/fixtures/html/<file>) + дешёвые метки.
#
# Поля:
#   id            уникальный идентификатор (имя snapshot-файла)
#   file          имя файла в tests/fixtures/html/
#   url           URL страницы (домен + отображение; влияет на page-score, если page_score не задан)
#   page_score    (опц.) переопределить URL-score. >=5 → high-score (ФИО держатся без личного контакта).
#                 Для заведомо руководящих/контактных фикстур ставим 20, т.к. точный URL не всегда известен.
#   min_people    (опц.) минимум записей с распознанным ФИО — счётчик-метка. Ставить ТОЛЬКО когда
#                 реально посчитали людей на странице (иначе полагаемся на snapshot).
#   must_find     (опц.) подстроки, которые ДОЛЖНЫ быть в сводке (фамилия, email, ИНН)
#   must_not_find (опц.) подстроки, которых быть НЕ должно (мусор)
#   notes         (опц.) заметка человеку
#
# Нет файла фикстуры → кейс SKIP (а не падает)
# Snapshot (snapshots/<id>.json) — страховка от регресса для всего остального вывода.

# ──── Существующие фикстуры (засев, реальный HTML уже в репо) ───────────────────────
# page_score: 20 — это руководящие/командные страницы; min_people оставлен только там,
# где число проверено (furuno_team, см. integration-тест). Остальное ловит snapshot.
- id: furuno_team
  file: furuno_team.html
  url: https://furuno.ru/team/
  page_score: 20
  min_people: 10
  notes: "Команда; >=10 проверено в tests/integration/test_furuno_fixture.py."

- id: furuno_contacts
  file: furuno_contacts.html
  url: https://furuno.ru/contacts/
  page_score: 20
  notes: "Контактная страница; число людей не проверено — снапшот."

- id: buhgalteriaplus_team
  file: buhgalteriaplus_team.html
  url: https://buhgalteriaplus.ru/komanda/
  page_score: 20

- id: gbu_lom_team
  file: gbu-lom_team.html
  url: https://gbu-lom.ru/about/team/
  page_score: 20
  notes: "На прогоне даёт 0 ФИО даже при высоком score — кандидат на разбор recall (E)."

- id: lachprofit_team
  file: lachprofit_team.html
  url: https://lachprofit.ru/team/
  page_score: 20

- id: minfogroup_team
  file: minfogroup_team.html
  url: https://minfogroup.ru/team/
  page_score: 20

- id: mosgorlombard_team
  file: mosgorlombard_team.html
  url: https://mosgorlombard.ru/team/
  page_score: 20

- id: ooolmz_team
  file: ooolmz_team.html
  url: https://ooolmz.ru/team/
  page_score: 20

- id: zavod_trud_team
  file: zavod-trud_team.html
  url: https://zavod-trud.ru/rukovodstvo/
