- id: intell_stroy_kontakty     # CE-6b — список «Должность <таб> ФИО»
  file: intell_stroy_kontakty.html
  url: https://intell-stroy.ru/kontakty
  min_people: 5
  must_find: ["распутин", "генеральные директора", "ломтева", "давыдов"]
  notes: >
    «Ключевые лица»: строки «Должность <много &nbsp;> ФИО», без личных тел./почт.
    Баг: выгружался последний (Давыдов/«Марьин» в скрине клиента) как гендир, остальные
    терялись (FIO-регекс через \n хватал слово след. строки в блочном fallback; flat
    не брал из-за гейта «нужен контакт»). Фикс: flat-проход держит ФИО при должности
    ПЕРЕД именем (tabular), +маркер «конструктор». Гендир = Распутин (а не Давыдов).
    page_score НЕ задан (реальный=5=HIGH) — проверяем prod-условия.

- id: dkc_details               # CE-6a — двухколоночная таблица реквизитов
  file: dkc_details.html
  url: https://www.dkc.ru/ru/about/details/
  min_people: 2
  must_find: ["колпашников", "жученкова", "главные бухгалтеры", "6905062011"]
  notes: >
    Реквизиты-таблица «должность | ФИО». Баг (старый код): главбух Жученкова
    попадала в гендиры / терялась, ФИО спаривалось поперёк строк. Фикс — проход по
    двухколоночным таблицам (пара берётся внутри <tr>). Гендир = Колпашников,
    главбух = Жученкова. page_score НЕ задан (реальный score=3) — KV-проход от него
    не зависит, проверяем prod-условия.

# ──── Правки заказчика (NOTES, серия 16.06, 400-сайтовая выгрузка) ──────────
- id: avvarus_rukovodstvo        # #5 — мусор «Кирове Образование» вместо гендира
  file: avvarus_rukovodstvo.html
  url: https://avva-rus.ru/company/rukovodstvo/
  must_find: ["егоров", "генеральные директора"]
  must_not_find: ["кирове образование"]
  notes: >
    Био-страница руководства. Баг: блочный fallback склеивал «…в г. Кирове\nОбразование:»
    в «ФИО» (FIO-регекс через \n), а бренд-капс «АВВА РУС» в строке «Генеральный директор
    АО «АВВА РУС»» делал её «похожей на ФИО» → строка-должность не опознавалась → реальный
    гендир Егоров А.Г. выше неё терялся. Фиксы: [^\S\n] в _FIO_CANDIDATE + отсев капс-бренда.

- id: atomsbyt_rukovodstvo       # #2 — главбух Зарницкая ошибочно в гендиры
  file: atomsbyt_rukovodstvo.html
  url: http://atomsbyt.ru/kompaniya/rukovodstvo
  must_find: ["рябцев", "генеральные директора", "зарницкая", "главные бухгалтеры"]
  notes: >
    WordPress-таблица, должность разбита на смежные <em>: «<em>генеральн</em><em>ый
    директор</em>». get_text вставлял \n → должность не опознавалась, осиротевший хвост
    «генерального директора» (от титула зама) цеплял главбуха Зарницкую как гендира,
    а реальный гендир Рябцев терялся. Фикс: unwrap inline-тегов + smooth().
    Теперь Рябцев=гендир, Зарницкая=главбух.

- id: bioastin_contact           # #16/#17 — мусорные «ФИО» (продукт/наречие)
  file: bioastin_contact.html
  url: https://bioastin.ru/contact/
  must_not_find: ["астаксантин", "зачем"]   # «астин» — подстрока названия «Биоастина», не годится
  notes: >
    Маркетинговая страница без реального ФИО директора. Баг: блочный fallback склеивал
    через \n «Астин\nАстаксантин» / «Астин\nЗачем» (бренд+наречие) под «Слово генерального
    директора». Фикс [^\S\n] в _FIO_CANDIDATE убирает мусор; людей на странице 0.

- id: chechencement_teams        # #39 — Дацаев (финдир) ошибочно гендир
  file: chechencement_teams.html
  url: https://chechencement.com/our-teams/
  min_people: 3
  must_find: ["байбетиров", "генеральные директора", "дацаев", "финансовые директора"]
  notes: >
    Список «ФИО\nдолжность». Баг: дефис в «Байбетиров Абдул-Хамид Сайпаевич» обрывал
    FIO-регекс (класс продолжения без заглавных) → «Генеральный директор» спаривался
    вперёд с Дацаевым (реально финдир), реальный гендир Байбетиров терялся. Фикс regex
    дефис-имён: Байбетиров=гендир, Дацаев=финдир.

- id: chechencement_contact      # #40 — битое «Хамид Сайпаевич»
  file: chechencement_contact.html
  url: https://chechencement.com/contact-us/
  must_find: ["байбетиров абдул-хамид сайпаевич", "генеральные директора"]
  notes: >
    «Генеральный директор: Байбетиров Абдул-Хамид Сайпаевич» на одной строке. Баг: тот же
    дефисный обрыв давал «Хамид Сайпаевич». Фикс regex: полное ФИО целиком.

- id: bautex_sotrudniki          # #10 — глава отдела ошибочно гендир
  file: bautex_sotrudniki.html
  url: https://bautex.ru/sotrudniki/
  min_people: 15
  must_find: ["мартынов", "руководителю отдела продаж", "гайворонский"]
  notes: >
    Команда (Elementor, имена/должности через <br>). Две правки: (a) «Генеральный
    директор ОТДЕЛА развития» (Гайворонский) → «Остальные», не гендир (exclude отдел);
    (b) осиротевший <br>-хвост «генерального директора» зама цеплял Мартынова вперёд,
    хотя у того своя должность ниже → защита «не воровать ФИО со своей должностью следом».
    Мартынов = «Руководитель отдела продаж» (Остальные). Реальный гендир Луттер не
    извлекается (имя разорвано <br>) — recall-хвост, не жалоба клиента; ключевое — в
    гендирах нет ложных лиц (полный состав — в snapshot).

- id: cigapan_contacts           # #44 — личный email гендира не подтянулся
  file: cigapan_contacts.html
  url: https://cigapan.ru/contacts
  must_find: ["цыганков", "gendirector@cigapan.ru", "генеральные директора"]
  notes: >
    Tilda (абсолютное позиционирование): в зоне карточки Цыганкова два ролевых ящика
    (gendirector@ и glavbuh@ соседа) → эвристика «ровно один» отвергала оба. Фикс:
    при неоднозначности матчим local-part с должностью (gendirector ↔ ген.директор).

- id: brazis_contact             # #31 — НЕ баг: гендир на сайте есть
  file: brazis_contact.html
  url: https://bra-zis.ru/contact/
  must_find: ["лоскутова марина григорьевна", "генеральные директора", "lm@bra-zis.ru"]
  notes: >
    Контроль: клиент написал «не нашёл инфо о гендире», но на странице явно
    «Генеральный директор- Лоскутова Марина Григорьевна» (email lm@bra-zis.ru).
