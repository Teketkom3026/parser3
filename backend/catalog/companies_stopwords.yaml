# Junk строки: если company_name после strip'ов совпадает — вернуть ""
exact_match:
  - команда
  - наша команда
  - наши специалисты
  - наши сотрудники
  - наш коллектив
  - контакты
  - контактная информация
  - руководство
  - о компании
  - о нас
  - главная
  - главная страница
  - our team
  - about us
  - about
  - staff
  - leadership
  - contacts
  - наш сайт
  - сайт компании
  # D1 (письмо п.12): должность подтянулась в название (34gaz → «главный бухгалтер»).
  # Только многословные «модификатор + роль» — они никогда не названия компаний
  # (одиночные «директор»/«бухгалтер» НЕ добавляем — бывают брендами/«Бухгалтерия Плюс»).
  - главный бухгалтер
  - генеральный директор
  - исполнительный директор
  - коммерческий директор
  - финансовый директор
  - технический директор
  - главный инженер
  - заместитель директора
  - заместитель генерального директора

# D1 (письмо п.12): страница-ошибка попала в название (albank → «Страница не найдена»).
# Проверка «содержит» (не exact) — ни одно реальное название их не содержит.
error_phrases:
  - страница не найдена
  - страница не существует
  - ничего не найдено
  - page not found
  - 404 not found
  - error 404
  - ошибка 404

# Префиксы, которые нужно срезать (pymorphy-lemma match)
prefixes_morph:
  - команда
  - сотрудники
  - руководство
  - специалисты
  - коллектив
  - профессионал
  - наш
  - наша
  - наши
  - познакомьтесь
  - знакомьтесь
